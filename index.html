<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louisiana PDV | Sistema de Assinaturas</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6; --secondary: #0f172a; --accent: #10b981;
            --danger: #ef4444; --bg: #0b0f1a; --card: #161b2c; --text: #f1f5f9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text); }

        header { background: rgba(11, 15, 26, 0.9); backdrop-filter: blur(12px); padding: 15px 6%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d334a; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 800; font-size: 1.4rem; }
        .logo span { color: var(--primary); }

        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); border: 1px solid #2d334a; padding: 35px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center; }
        
        /* Planos */
        .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 25px; }
        .plan-card { background: #1e253a; padding: 30px; border-radius: 20px; border: 2px solid transparent; cursor: pointer; transition: 0.3s; }
        .plan-card:hover { border-color: var(--primary); }
        .price { font-size: 2.2rem; font-weight: 800; color: #fff; margin: 10px 0; }

        /* Status Hero */
        .status-hero { background: #1e253a; padding: 20px; border-radius: 15px; margin-bottom: 25px; border-left: 5px solid var(--primary); text-align: left; }
        
        /* Inputs e Botões */
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2d334a; background: #0b0f1a; color: #fff; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-main { background: var(--primary); color: white; }
        .btn-sec { background: transparent; color: #94a3b8; border: 1px solid #2d334a; }

        .qr-code { width: 220px; border-radius: 15px; margin: 15px 0; border: 5px solid #fff; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">LOUISIANA<span>PDV</span></div>
        <div id="nav-btn-area">
            <button class="btn btn-sec" onclick="showScreen('scr-auth')" style="width: auto; padding: 8px 20px;">Entrar</button>
        </div>
    </header>

    <div class="container">
        
        <div id="scr-home" class="screen active">
            <div id="status-area" class="status-hero hidden">
                <p id="welcome-msg" style="font-weight: 700;"></p>
                <div id="order-info" style="font-size: 0.9rem; margin-top: 5px;"></div>
            </div>

            <h1 style="text-align: center; margin-bottom: 30px;">Licenças Disponíveis</h1>
            <div class="plans-grid">
                <div class="plan-card" onclick="selectPlan('Mensal', 'R$ 49,90')">
                    <h3>Mensal</h3>
                    <div class="price">R$ 49,90</div>
                    <button class="btn btn-main">Assinar Agora</button>
                </div>
                <div class="plan-card" onclick="selectPlan('Anual', 'R$ 499,00')">
                    <h3>Anual</h3>
                    <div class="price">R$ 499,00</div>
                    <button class="btn btn-main">Assinar Agora</button>
                </div>
            </div>
        </div>

        <div id="scr-auth" class="screen">
            <div class="card" style="max-width: 420px; margin: auto;">
                <h2 id="auth-title">Crie sua Conta</h2>
                <div class="form-group" id="name-group">
                    <label>Nome Completo</label>
                    <input type="text" id="in-name">
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="in-email">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="in-pass">
                </div>
                <button class="btn btn-main" id="btn-do-auth">Continuar</button>
                <button class="btn btn-sec" id="btn-toggle-auth">Já sou cliente? Login</button>
            </div>
        </div>

        <div id="scr-pay" class="screen">
            <div class="card">
                <h2>Pagamento via PIX</h2>
                <p id="pay-info" style="color: var(--primary); font-weight: 700;"></p>
                
                <img src="qr.jpeg" alt="QR Code PIX" class="qr-code">
                
                <p style="margin: 10px 0;">Chave Celular: <strong>11981127561</strong></p>

                <div class="form-group" style="margin-top: 20px;">
                    <label>Anexe o Comprovante:</label>
                    <input type="file" id="in-file" accept="image/*">
                </div>
                <button class="btn btn-main" id="btn-send-pix">Enviar e Finalizar</button>
            </div>
        </div>

        <div id="scr-wait" class="screen">
            <div class="card">
                <h1 style="font-size: 4rem;">📨</h1>
                <h2>Recebido com sucesso!</h2>
                <p style="margin: 20px 0; color: #94a3b8; line-height: 1.6;">
                    Nossa equipe vai aprovar seu pedido em até **24h**. <br>
                    O acesso será enviado para o seu WhatsApp.
                </p>
                <button class="btn btn-main" onclick="showScreen('scr-home')">Voltar ao Início</button>
            </div>
        </div>

        <div id="scr-admin" class="screen">
            <div class="card">
                <h2>Aprovações Pendentes</h2>
                <div id="adm-list" style="margin-top: 20px; text-align: left;"></div>
                <button class="btn btn-sec" onclick="showScreen('scr-home')">Sair do Admin</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-ZW6jOk2-RSG6YN88ScUUFLglc4jEbXo",
            authDomain: "as26-cb591.firebaseapp.com",
            projectId: "as26-cb591",
            storageBucket: "as26-cb591.firebasestorage.app",
            messagingSenderId: "751027383294",
            appId: "1:751027383294:web:2696e0ee0c7cfc6b516eaf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let selPlan = null;
        let isLoginMode = false;
        let currentUser = null;

        // --- Navegação ---
        window.showScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        window.selectPlan = (name, price) => {
            selPlan = { name, price };
            if(!currentUser) { showScreen('scr-auth'); }
            else { 
                document.getElementById('pay-info').innerText = `Plano ${name} - ${price}`;
                showScreen('scr-pay'); 
            }
        };

        // --- Auth ---
        document.getElementById('btn-toggle-auth').onclick = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Entrar" : "Crie sua Conta";
            document.getElementById('name-group').style.display = isLoginMode ? "none" : "block";
            document.getElementById('btn-toggle-auth').innerText = isLoginMode ? "Novo por aqui? Cadastre-se" : "Já sou cliente? Login";
        };

        document.getElementById('btn-do-auth').onclick = async () => {
            const email = document.getElementById('in-email').value;
            const pass = document.getElementById('in-pass').value;
            const name = document.getElementById('in-name').value;
            try {
                if(isLoginMode) { await signInWithEmailAndPassword(auth, email, pass); }
                else {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await addDoc(collection(db, "usuarios"), { uid: res.user.uid, nome: name, email });
                }
                if(selPlan) {
                    document.getElementById('pay-info').innerText = `Plano ${selPlan.name} - ${selPlan.price}`;
                    showScreen('scr-pay');
                } else { showScreen('scr-home'); }
            } catch (e) { alert("Erro: " + e.message); }
        };

        // --- BOTÃO DE SAIR (CORRIGIDO) ---
        window.handleLogout = async () => {
            try {
                await signOut(auth);
                location.reload(); 
            } catch (e) { console.error("Erro ao sair", e); }
        };

        onAuthStateChanged(auth, (u) => {
            currentUser = u;
            const nav = document.getElementById('nav-btn-area');
            if(u) {
                nav.innerHTML = `<button class="btn btn-sec" onclick="handleLogout()" style="width:auto; padding:8px 20px;">Sair</button>`;
                if(u.email === 'louisianapdv@gmail.com') nav.innerHTML += `<button class="btn btn-main" onclick="openAdmin()" style="width:auto; padding:8px 20px; margin-left:10px; background:var(--danger)">Admin</button>`;
                checkStatus(u.email);
            } else {
                nav.innerHTML = `<button class="btn btn-main" onclick="showScreen('scr-auth')" style="width:auto; padding:8px 20px;">Entrar / Criar</button>`;
                document.getElementById('status-area').classList.add('hidden');
            }
        });

        // --- Pagamento (CORRIGIDO PARA NÃO TRAVAR) ---
        document.getElementById('btn-send-pix').onclick = async () => {
            const file = document.getElementById('in-file').files[0];
            if(!file) return alert("Selecione o comprovante.");

            const btn = document.getElementById('btn-send-pix');
            btn.disabled = true;
            btn.innerText = "Enviando... Aguarde";

            try {
                const sRef = ref(storage, `comprovantes/${currentUser.uid}_${Date.now()}`);
                const uploadTask = await uploadBytes(sRef, file);
                const url = await getDownloadURL(uploadTask.ref);

                await addDoc(collection(db, "pedidos"), {
                    email: currentUser.email,
                    plano: selPlan ? selPlan.name : "Renovação",
                    comprovante: url,
                    status: 'pendente',
                    data: serverTimestamp()
                });

                showScreen('scr-wait');
            } catch (e) {
                console.error(e);
                alert("Erro ao enviar: Verifique se o Storage está configurado no Firebase.");
                btn.disabled = false;
                btn.innerText = "Enviar e Finalizar";
            }
        };

        async function checkStatus(email) {
            const q = query(collection(db, "pedidos"), where("email", "==", email));
            const snap = await getDocs(q);
            const area = document.getElementById('status-area');
            if(snap.empty) return;

            area.classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = "Olá, " + email.split('@')[0];
            const p = snap.docs[snap.docs.length-1].data();
            document.getElementById('order-info').innerHTML = p.status === 'pendente' ? 
                "<span style='color:#f59e0b'>⌛ Pedido em análise (24h)</span>" : 
                "<span style='color:#10b981'>✅ Assinatura Ativa!</span>";
        }

        // --- Admin ---
        window.openAdmin = async () => {
            showScreen('scr-admin');
            const q = query(collection(db, "pedidos"), where("status", "==", "pendente"));
            const snap = await getDocs(q);
            let h = "";
            snap.forEach(d => {
                const p = d.data();
                h += `<div style="padding:10px; border-bottom:1px solid #334155;">
                    ${p.email} - ${p.plano} <br>
                    <a href="${p.comprovante}" target="_blank" style="color:var(--primary)">Ver Comprovante</a> | 
                    <button onclick="approve('${d.id}')" style="color:var(--accent); background:none; border:none; cursor:pointer;">APROVAR</button>
                </div>`;
            });
            document.getElementById('adm-list').innerHTML = h || "Sem pedidos.";
        };

        window.approve = async (id) => {
            await updateDoc(doc(db, "pedidos", id), { status: 'aprovado' });
            alert("Aprovado!");
            openAdmin();
        };
    </script>
</body>
</html>
